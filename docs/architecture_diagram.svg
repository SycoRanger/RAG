<rect x="40" y="613" width="1120" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="639" font-size="14" font-weight="700" fill="#0f172a">Hallucination guardrails (enforced between stages 6 and 7):</text>
<text x="60" y="663" font-size="13" fill="#334155">1) Similarity-threshold filtering drops weak matches after retrieval &#8226; 2) Zero surviving chunks short-circuits before the LLM is ever called</text>
<text x="60" y="683" font-size="13" fill="#334155">3) Strict system prompt restricts the LLM to supplied context only &#8226; 4) Fixed refusal sentence when context is insufficient &#8226; 5) temperature = 0</text>
